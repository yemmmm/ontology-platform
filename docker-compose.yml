services:
  postgres:
    image: postgres:17
    container_name: ontology-platform-postgres
    environment:
      POSTGRES_DB: ontology_platform
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: ontology-platform-oxigraph
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/oxigraph", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  oxigraph_data:
