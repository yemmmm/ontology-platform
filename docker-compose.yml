services:
  postgres:
    image: postgres:17
    container_name: ontology-platform-postgres
    environment:
      POSTGRES_DB: ontology_platform
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: ontology-platform-neo4j
    environment:
      NEO4J_AUTH: neo4j/ontology-platform
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

