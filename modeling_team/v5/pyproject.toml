[project]
name = "ontoweave-modeling-v5"
version = "0.1.0"
description = "Explicit v5 modeling runtime for OntoWeave"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "langgraph==1.2.18",
  "langgraph-checkpoint-postgres==3.2.0",
  "mcp==1.28.0",
  "openai-codex==0.163.0",
  "psycopg[binary]==3.3.6",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
