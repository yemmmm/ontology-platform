# R3.0-011 competency-question roster: the R3.0-002 core three roles plus one
# competency-question Agent.  Loaded only through
# load_multi_slice_team_configuration for a v2 Task that declares
# parameters.competency_question_acceptance: true; without that selector the
# R3.0-002 three-role roster stays byte-identical and no CQ contract is loaded.
#
# The competency-question role owns no communication edge: its private drafts,
# reviews, and interview turns reach it only through the Runner-owned direct
# channel (outer FIFO/stdin and the role-bound Runner capability), never through
# Coordinator or Team Transport.
schema_version: 1
profile_id: r3-0-011-competency-question
runtime: codex
agents:
  - agent_id: coordinator
    package: coordinator
  - agent_id: modeling
    package: modeling
  - agent_id: protocol
    package: protocol
  - agent_id: competency-question
    package: competency-question
communication:
  - from: coordinator
    to: [modeling, protocol]
  - from: modeling
    to: [coordinator, protocol]
  - from: protocol
    to: [coordinator, modeling]
# parameters: llm_inactivity_timeout_seconds raises the codex adapter's LLM
# inactivity watchdog (default 300s) for external direct routes: glm-5.3-flash
# at max reasoning effort over the full staged context can emit a single
# reasoning item that stays silent well beyond 300s while the upstream stream
# is alive.  1200s still fails fast on a genuinely hung endpoint.  The adapter
# reads run.configuration.profile.parameters (codex.py), so this is the
# authoritative profile-level knob; it applies to every role in the roster.
parameters:
  llm_inactivity_timeout_seconds: 1200.0
  # 2026-09-11 auth006-start6: the real staged run reached the approved 172-item
  # materialization plan right at the 5400s default wall (productive long-run
  # coordination, not a stall).  10800s keeps the T3 latch as a real guard for
  # stalled runs while leaving room for the full staged order.
  run_fallback_timeout_seconds: 10800.0
