# R3.0-006 real full v3.0 task: the single complete real entry point that
# selects every staged capability of the chain in one Task
# (R3.0-002 multi-slice workflow + R3.0-008B staged decisions + R3.0-009
# unified semantic graph + R3.0-011 competency-question acceptance).
#
# GATE (double): this task MUST NOT be started before (a) the R3.0-009 and
# R3.0-011 mechanical increments are delivered and independently verified as
# required by the R3.0-008B double gate, and (b) the user-authorized R3.0-006
# modeling start for the real v3.0 run is granted. Starting it consumes a real
# modeling start and requires the attempt budget granted with that
# authorization. Mechanical delivery must not start it on its own.
#
# The two frozen legacy opt-in assets stay unchanged and loadable:
# tasks/r3-0-008b-staged-real.yaml (staged + CQ, 008B slot contract) and
# tasks/r3-0-009-unified-graph-real.yaml (staged + unified, no CQ stage). This
# task is the union: it selects unified_semantic_graph, so the stage 3 slot is
# the r3-0-009-stage3-slot/v1 form with candidate_contract
# r3-0-009-unified-graph/v1 (no deferred_contract is in force), and it selects
# competency_question_acceptance, so the CQ public projection must be frozen
# before the first Modeling Batch submission.
#
# role_sources carries two disjoint classes:
# - business inputs: exactly the 4 allowed_files of
#   docs/evaluation-scenarios/industrial-service-v3/modeling-input/input-manifest.json
#   (scenario-brief.md, business-terms.md, schema.sql, sample-data.sql), staged
#   per the R3.0-008B real-task precedent including the competency-question
#   role reading the same approved inputs as Modeling.
# - platform/protocol reference contracts under modeling_team/references/
#   (staged to /agent/home/sources/modeling_team/references/). These are
#   platform contracts, not business inputs and not tester-only truth.
#
# protocol_tools deliberately OMITS submit_modeling_batch: every Modeling
# Batch submission in this task goes through the Runner-private
# protocol_staged_submit_modeling_batch capability only.
schema_version: 2
task_id: r3-0-006-real-full
objective: >-
  Model the complete industrial after-service v3 scenario through the staged
  order with the R3.0-011 competency-question stage ahead of base semantics:
  scenario understanding and interview, panorama competency questions with the
  user-reviewed approved public projection, logical slicing fed by that
  approved public projection only, per-slice competency questions with user
  review and the frozen public/hidden grouping before any neutral candidate is
  modeled, the platform neutral base-graph candidates and commonality
  abstraction under
  modeling_team/references/r3-0-009-unified-graph-contract.json, the R3.0-002
  topology decision, base business semantics modeling with value analysis
  recorded as analyzed_not_materialized conclusions, database mapping and value
  semantics materialization through the staged submission capability, and the
  joint acceptance checklist. Modeling writes the neutral candidate artifacts
  (entities, relations, properties and shapes with business meaning, evidence,
  logical slice and shared scope) under stage3-neutral-graph/candidates/
  together with the r3-0-009-stage3-slot/v1 slot carrying
  candidate_contract r3-0-009-unified-graph/v1; the Coordinator records
  per-item commonality decisions and translation approvals in the
  r3-0-009-approvals/v1 artifact; Protocol publishes the
  r3-0-009-materialization-plan/v1 materialization plan with the complete
  approved projection; and the Runner binds the projection, its digest and the
  candidate/approval bindings into the r3-0-009-submission-intent/v1 and
  r3-0-009-submission-receipt/v1 records. Modeling and Coordinator register
  every controlled-value candidate as an analysis conclusion in analyzed status
  under value-semantics/conclusions/analysis-conclusions.json with evidence
  refs, proposed level, blocking unknowns, and an immutable archived revision
  chain, and never self-confirm a value from database samples; Coordinator
  approves conclusion transitions only after business confirmation, records
  the approvals artifact and the materialization unlock, and maintains the
  joint acceptance checklist with the seven fixed items. Protocol alone
  submits Modeling Batches exclusively through the
  protocol_staged_submit_modeling_batch capability with verbatim envelopes,
  value traces naming the confirmed conclusions, and L3 nodes only for
  confirmed L3 conclusions, maintains the materialization ledger against
  authoritative receipts, and never bypasses the capability with a direct
  platform write. Public competency questions and answers are read only from
  the highest-ordinal
  competency-questions/public/public-projection-*.json projection; hidden
  questions, hidden answers and the frozen pool stay host-only and are never
  written into platform content, candidates or messages. All staged artifacts
  follow the mounted
  modeling_team/references/r3-0-008b-staged-decisions-contract.json and
  modeling_team/references/r3-0-009-unified-graph-contract.json. Existing
  entities may be bound with a legal zero Class state through the 009 read
  model. Keep business rows in PostgreSQL: never create RDF individuals for
  source rows; treat schema names and samples as mapping evidence, not
  business truth.
role_sources:
  # R3.0-016 ledger #21: Protocol's terminal duties quote business scope and
  # terms verbatim into evidence excerpts, but its sandbox had neither owner
  # source, forcing the excerpt supply chain through Coordinator/owner relay.
  # scenario-brief.md and business-terms.md are staged to protocol too;
  # schema.sql and sample-data.sql stay Modeling/competency-question-only
  # (mapping evidence is not a Protocol terminal-report need — least privilege).
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/scenario-brief.md
    classification: business-source
    roles: [coordinator, modeling, competency-question, protocol]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/business-terms.md
    classification: business-source
    roles: [coordinator, modeling, competency-question, protocol]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/schema.sql
    classification: business-source
    roles: [modeling, competency-question]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/sample-data.sql
    classification: business-source
    roles: [modeling, competency-question]
  - path: modeling_team/references/r3-0-002-scenario-map-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/r3-0-008b-staged-decisions-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/r3-0-009-unified-graph-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/platform-neutral-candidate-authoring.json
    classification: protocol
    roles: [modeling, protocol]
  - path: modeling_team/references/modeling-batch-item-contract.json
    classification: protocol
    roles: [protocol]
  - path: modeling_team/references/r3-0-011-competency-question-contract.json
    classification: coordination
    roles: [competency-question]
  # Union-task completeness: the Protocol instructions' Prompt E names this
  # staged reference; the r3-0-002 multi-slice entry stages it for the protocol
  # role and the protocol role blocked on its absence (2026-09-11 auth006-start6
  # delivery-4 required_source_unavailable).  Stage the same file here so the
  # union entry carries every staged source its role instructions can require.
  - path: modeling_team/references/acceptance-stage-handoff-contract.json
    classification: protocol
    roles: [protocol]
