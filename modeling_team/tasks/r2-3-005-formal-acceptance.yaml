schema_version: 2
task_id: r2-3-005-formal-acceptance
objective: >-
  Run one bounded Dify Workflow-as-Tool C -> B -> A modeling slice in the fresh Project/Ontology
  created and owned by this run, then hand it to the persistent Acceptance role. Never reuse or
  bind a caller-supplied or prior-run Project/Ontology, and never create a second semantic start
  inside this task. Coordinator receives no raw business-source bytes and only serializes the
  separate Modeling-ready and Protocol-silent signals before publishing an immutable ticket for
  each of two competency questions. Acceptance uses only two fresh, isolated Examiner pairs per
  round and preserves explicit unknowns. Modeling owns source-grounded semantics; Protocol alone
  performs deterministic candidate-v2/Batch translation, dry-run, apply_atomic, readback,
  validation, reasoning, and governed retrieval. Every Modeling candidate revision is a complete,
  self-contained immutable candidate: resend all unchanged items, citations, constraints,
  dependencies, and consumer queries exactly, include explicit semantic changes in full, and never
  use revision_basis, revision_operation, replace_item_id, or a patch-only substitute. Protocol
  never merges prior deliveries and invokes build_candidate_receipt against the entire current
  candidate before every receipt or conflict response. Before the first candidate and before every
  full revision, Modeling and Protocol must read and apply the staged
  modeling_team/references/platform-neutral-candidate-authoring.json scenario-neutral authoring
  checklist; keep Team Transport delivery/reply identities and Batch/platform IDs outside the
  neutral semantic candidate. The candidate's whole-candidate/immutable rule is semantic integrity,
  not one platform transaction: Protocol alone translates it into dependency-ordered platform
  stages, each required apply stage is independently atomic (`dry_run` then `apply_atomic`), and
  generated IDs/IRIs come only from preceding formal receipts or required reads. The fresh
  Project/Ontology, Build Session/Lease, Batch/Item envelopes, stage ordering, and all other
  platform mechanics belong to Runner/Protocol and must never appear in Modeling's semantic
  constraints. Modeling constraints must remain source-grounded semantic invariants only. For formal
  R2.3-005, every `relation` item must carry at least one source-grounded `evidence_citations` entry;
  a missing or empty relation citation must use build_candidate_conflict with the same complete
  candidate and cannot be accepted. This relation-specific gate does not promote ordinary unbound
  v2 tasks to the same hard requirement. A build_candidate_receipt status=accepted verifies only
  the neutral envelope and canonical semantic/candidate digests; it is not evidence of dry_run,
  apply_atomic, readback, validation, reasoning, or governed retrieval. Until every required gate
  is complete, Modeling must not send ready_for_acceptance and Protocol must not send
  silent_for_acceptance or a successful handoff. Every
  entity or explicit_unknown item that Protocol materializes as create_entity must carry a
  non-empty source-grounded semantic.values.label; when a negative_probe materializes a
  semantic.invalid_instance for rejection, that object must carry its own non-empty source-grounded
  label.
  Protocol rejects missing or blank labels and never derives or invents them from item_id,
  entity_id, or question text. For governed retrieval, Protocol must resolve the run-owned
  Project/Ontology from formal receipts, query `query_semantic_context` only with
  `scope_mode=ontologies` and exact `ontology_ids`, issue one narrow query per competency question,
  and use lexical search when `vector_index_missing` makes hybrid recall incomplete. For each
  competency question, freeze the first request's exact `query`, `project_id`, `scope_mode`,
  `ontology_ids`, `resource_types`, `assertion_types`, `search_mode`, `depth`, `limit`, and
  `context_limit`; a context continuation may change only `context_cursor`, while a match
  continuation may change only `match_cursor` and must start a new context chain. Never carry a
  cursor across competency questions, send both cursors, or alter a frozen query argument.
  Consume each current page's context cursor to exhaustion before its match cursor, start a new
  context chain for each match page, never send or reuse both cursors, and do not treat entity/fact
  fallback readback as generic retrieval completion. Only non-truncated, non-degraded generic results
  with required Evidence and lineage may produce `ready_for_acceptance`; ticket/run/model-state
  bindings belong in Protocol receipts and the Acceptance handoff, not query arguments. Do not expose
  expected answers or invoke generic multi-agent/spawn capabilities. Every candidate citation must map one-to-one to its
  supporting field via platform-supported inline `evidence:{document_name,excerpt}` or an existing
  reference ID; entity and explicit_unknown evidence/evidence_reference_ids may not be empty when
  their candidate citation requires support. Keep source SHA/locator/owner-answer metadata only in
  local Protocol receipt/evidence binding and verify EvidenceReference/Association plus origin lineage
  after apply/readback.
