schema_version: 2
task_id: r2-3-005-formal-acceptance
objective: >-
  Run one bounded Dify Workflow-as-Tool C -> B -> A modeling slice and hand it to the
  persistent Acceptance role. Coordinator serializes modeling ready/silence acknowledgements,
  then publishes an immutable ticket for each of two competency questions. Acceptance uses only
  two fresh, isolated Examiner pairs per round and preserves explicit unknowns. Modeling owns
  semantics; Protocol alone performs dry-run, apply_atomic, readback, validation, and reasoning.
  Do not create a second semantic start, reuse a prior Project/Ontology, expose expected answers,
  or invoke generic multi-agent/spawn capabilities.
