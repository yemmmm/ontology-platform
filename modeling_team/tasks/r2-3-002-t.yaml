schema_version: 2
task_id: r2-3-002-t
objective: >-
  Execute the bounded published Dify Workflow-as-Tool C -> B -> A slice from the frozen
  role-private sources. Coordinator assigns work and asks one grounded question at a time;
  Modeling owns ontology semantics and sends candidates to Protocol. Protocol alone performs
  immutable dry_run then apply_atomic, records inline Evidence, reads receipts, lineage and all
  pagination, runs validation/reasoning, and completes the native v2 retrieval verifier. Do not
  invent unavailable facts or infer a concrete Tool version without a grounded owner answer.
  Preserve explicit unknowns and retain every rejected Shape dry-run receipt without workspace
  movement. The candidate must use the frozen 48-row assertion matrix IDs and citations exactly.
