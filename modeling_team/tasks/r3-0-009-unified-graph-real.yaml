# Current unified modeling execution: R4.3-024/025.
# A real semantic start still requires explicit user authorization.
# Historical retained runs are not migrated or resumed by editing this Task.
schema_version: 2
task_id: r3-0-009-unified-graph-real
objective: >-
  Model the industrial after-service v3 scenario through the existing source/interview,
  logical slicing, business commonality and confirmed topology stages. Modeling authors
  immutable r3-0-009-unified-graph/v2 candidates with business meaning, explicit
  relationships, logical slice/shared scope and unknowns, together with the existing stage3
  slot needed for business scope/topology review. Coordinator confirms those business
  decisions. Modeling directly submits selected explicit changes through
  modeling_submit_model_changes under the mounted r4-3-025-direct-modeling-contract.json; the
  program binds actual resources, fills execution fields, orders dependencies and performs one
  apply_atomic per batch, retaining actual intent/receipt/Attempt evidence. There is no
  mandatory Protocol translation, plan authoring, translation approval or dry-run. On success
  Modeling recalls approved questions and expands actual IRIs; preserve partial/index status
  and unknowns. Before handoff complete the existing global coverage and production
  association self-check; independent semantic acceptance remains separate. A legal zero Class
  state is supported. Keep business rows in PostgreSQL and never create RDF individuals for
  source rows. Source fidelity and necessary business confirmation are unchanged.
