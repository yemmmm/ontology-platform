# R3.0-009 unified semantic graph and commonality abstraction task (frozen
# configuration asset; see design §9).
#
# GATE (double): like r3-0-008b-staged-real this task MUST NOT be started
# before the user-authorized modeling start for the real v3.0 run is granted.
# It declares parameters.unified_semantic_graph, which rides on the R3.0-002
# multi-slice workflow and the R3.0-008B staged decisions capability; the
# dependency is enforced by modeling_team/contracts.py.
#
# role_sources: the same four business inputs as the 008B real task plus the
# 008B staged contract and the 009 unified-graph contract. The 009 contract is
# the only new mounted truth; it is a platform contract, not business input.
#
# protocol_tools deliberately OMITS submit_modeling_batch: every Modeling
# Batch submission goes through the Runner-private
# protocol_staged_submit_modeling_batch capability only, and in this task it
# additionally requires plan_ref with the approved materialization plan.
schema_version: 2
task_id: r3-0-009-unified-graph-real
objective: >-
  Model the industrial after-service v3 scenario through the staged order and
  additionally publish the unified semantic graph commonality layer: Modeling
  writes the neutral candidate artifacts (entities, relations, properties and
  shapes with business meaning, evidence, logical slice and shared scope) under
  stage3-neutral-graph/candidates/ together with the r3-0-009-stage3-slot/v1
  slot, the Coordinator records per-item commonality decisions and translation
  approvals in the r3-0-009-approvals/v1 artifact, Protocol publishes the
  r3-0-009-materialization-plan/v1 materialization plan with the complete
  approved projection, and the Runner binds the projection, its digest and the
  candidate/approval bindings into the r3-0-009-submission-intent/v1 and
  r3-0-009-submission-receipt/v1 records. All staged artifacts follow the
  mounted modeling_team/references/r3-0-009-unified-graph-contract.json and
  modeling_team/references/r3-0-008b-staged-decisions-contract.json. Existing
  entities may be bound with a legal zero Class state through the 009 read
  model; keep business rows in PostgreSQL and never create RDF individuals for
  source rows.
role_sources:
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/scenario-brief.md
    classification: business-source
    roles: [coordinator, modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/business-terms.md
    classification: business-source
    roles: [coordinator, modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/schema.sql
    classification: business-source
    roles: [modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/sample-data.sql
    classification: business-source
    roles: [modeling]
  - path: modeling_team/references/r3-0-002-scenario-map-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/r3-0-008b-staged-decisions-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/r3-0-009-unified-graph-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/platform-neutral-candidate-authoring.json
    classification: protocol
    roles: [modeling, protocol]
  - path: modeling_team/references/modeling-batch-item-contract.json
    classification: protocol
    roles: [protocol]
protocol_tools:
  - check_platform_health
  - get_project_build_context
  - get_ontology_workspace_context
  - create_build_session
  - get_build_session
  - save_build_checkpoint
  - complete_build_session
  - cancel_build_session
  - acquire_ontology_lease
  - renew_ontology_lease
  - release_ontology_lease
  - get_modeling_batch
  - list_session_modeling_batches
  - list_ontology_modeling_batches
  - get_modeling_context
  - get_ontology_read_model
  - query_semantic_context
  - run_semantic_validation
  - run_semantic_reasoning
  - get_ontology_lineage
  - inspect_semantic_statement_provenance
  - list_semantic_protection_sets
  - create_semantic_protection_set
  - update_semantic_protection_set
  - delete_semantic_protection_set
  - add_semantic_protection_set_members
  - remove_semantic_protection_set_members
expected_terminal_evidence:
  - scenario-map-six-sections-maintained
  - topology-decision-three-options-six-dimensions
  - stage3-neutral-slot-with-009-contract
  - 009-candidates-published-with-evidence
  - 009-approvals-decisions-and-translation-approvals-recorded
  - 009-materialization-plan-with-approved-projection
  - staged-submission-receipts-and-ledger-closed
  - joint-acceptance-checklist-seven-items
  - explicit-unknowns-resolved-or-retained
retain_nonempty: true
semantic_start_evidence:
