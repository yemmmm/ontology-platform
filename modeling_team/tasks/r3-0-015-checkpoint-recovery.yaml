# R3.0-015 modeling-stage checkpoints task (frozen configuration asset;
# design §9).
#
# GATE (triple): this task MUST NOT be started before the user-authorized
# modeling start for the real v3.0 run is granted.  It declares
# parameters.modeling_checkpoints, which requires the R3.0-002 multi-slice
# workflow, the R3.0-008B staged decisions capability and the R3.0-009
# unified semantic graph; the dependency is enforced by
# modeling_team/contracts.py.
#
# SCOPE (S1 only): modeling_checkpoints enables persistent stage-result
# save/inspect (checkpoints/ under the run root plus the read-only host
# ``checkpoint inspect`` CLI and the outer ``action=checkpoint`` dispatch).
# It is NOT a resume capability: cross-process production resume (S2),
# translation-approval auto-migration (S3, deferred by design) and
# acceptance-only continuation (S4) are separate later segments.
#
# role_sources/protocol_tools deliberately mirror the 009 real task: the
# checkpoint selector adds no new mounted truth and no new agent write
# permission.  Saves copy only already-published run artifacts the Runner
# verifies on disk; CQ frozen pools, hidden basis and approved interview
# originals stay host-private and are never mounted to production roles.
#
# competency_question_acceptance is declared so the CQ-stage kinds
# (scenario_mapped/cq_frozen/production_handoff) are reachable on the same
# run; the acceptance_target stays the default full_joint unless the user
# freezes cq_semantic explicitly.
schema_version: 2
task_id: r3-0-015-checkpoint-recovery
objective: >-
  Model the industrial after-service v3 scenario exactly like the r3-0-009-unified-graph-real
  task (staged business decisions, unified semantic graph, direct Modeling changes and single
  atomic apply under R4.3-024/025), while the Runner additionally persists immutable
  stage-result checkpoints at the existing publication points: scenario/interview decisions
  before CQ freeze, the frozen CQ pool with its public projection, approved staged semantic
  decisions, each confirmed materialization batch receipt, and the production handoff.  A
  checkpoint save is triggered by the Runner at those publication points or requested by the
  host/Coordinator through the outer checkpoint action; the Runner always verifies the actual
  published artifacts on disk and rejects a stage-complete claim without artifacts.
  Checkpoints never grant new agent write permission, never package secrets or host-private
  material into a production-visible projection, and never consume a semantic start; the same
  content re-requested under a new request id reuses the existing package.
