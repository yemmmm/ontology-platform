schema_version: 2
task_id: r2-3-003-existing-scope-incremental
objective: >-
  Continue the retained non-empty Start75 Project/Ontology in existing mode with one complete,
  source-grounded incremental candidate. Read only the current platform facts, the approved
  Start75 source material, and the two approved incremental source documents staged for Modeling.
  Preserve both historical ExplicitUnknown resources and their old Evidence/lineage; express a
  source-bounded resolution as additive semantic state. Add exactly one bounded C evaluation -> B
  publishability decision -> A publication outcome case. Do not recreate, delete, overwrite, or
  infer any existing platform identity. Existing semantic endpoints must be declared with the
  platform-neutral existing_entity_ref form (semantic_id plus expected_class only); Protocol obtains
  the live IRI and class through its read-model binding receipt. A candidate is the complete
  increment for this run, never a patch and never a replay of the Start75 candidate. Coordinator
  receives no raw source. Modeling owns business semantics and explicit unknowns; Protocol alone
  performs deterministic binding, translation, dry-run, apply_atomic, readback, validation,
  reasoning, and governed retrieval. Acceptance receives exactly the two frozen CQs in the
  requirement-owned standard and runs the same two sequential fresh Examiner rounds as the
  accepted formal runner. The existing Project/Ontology is retained after cleanup; any mutation
  uncertainty or failed readback stops new starts and preserves the scope for human handling.
