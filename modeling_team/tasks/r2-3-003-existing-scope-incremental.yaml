schema_version: 2
task_id: r2-3-003-existing-scope-incremental
objective: >-
  Continue the retained non-empty Start75 Project/Ontology in existing mode with one complete,
  source-grounded incremental candidate. Read only the current platform facts, the approved
  Start75 source material, and the approved incremental source documents staged for Modeling.
  Apply the requirement-owned deletion policy to exactly the frozen ExplicitUnknown semantic IDs
  `unknown-cross-release-output-meaning` and `unknown-b-no-score-behavior`, each with
  `expected_class=ExplicitUnknown`; preserve every non-target explicit unknown and all unrelated
  retained scope. Each deletion is an item with a unique `item_id`, exact
  `item_kind=delete_existing_entity`, and a `semantic` object containing exactly
  `semantic_id`, `expected_class`, and `delete_mode=full_live_impact` (do not use
  `entity_delete` or nest an `existing_entity_ref` inside a delete item). Do not recreate,
  overwrite, or infer any existing platform identity. Existing semantic endpoints use the
  platform-neutral existing_entity_ref form (semantic_id plus expected_class only); Protocol
  obtains live canonical identity and complete paginated statement-impact receipts. The complete
  initial candidate must also include two independent standalone `existing_entity_ref` items, one
  for each frozen delete target, each with a unique `item_id`, `item_kind=existing_entity_ref`, and
  semantic exactly `semantic_id` plus `expected_class`; these binding items are separate from the
  delete items.
  The candidate must include these two ordered delete declarations plus the bounded business-slice
  items; delete declarations keep exactly `semantic_id`, `expected_class`, and `delete_mode` and
  never nest an `existing_entity_ref` or carry Agent-authored IRIs, triples, expected edges, or
  impact digests. The initial `candidate_revision` is the JSON number `1`, not the quoted string
  `"1"`; every
  conflict-bound full revision must use the next strictly greater integer (`2`, then `3`, ...),
  never the invalidated revision or candidate digest. In the observed delivery-8 -> delivery-9
  path, do not reuse `r23003-retained-scope-increment-1`; delivery-9 must carry the next
  deterministic revision. Add one bounded source-grounded
  C-evaluation -> B-publishability -> A-publication outcome increment. Coordinator receives no raw
  source. Modeling owns business semantics and explicit unknowns; Protocol alone performs
  deterministic binding, translation, Phase-A readback, delete-only Phase-B application, readback,
  validation, reasoning, and governed retrieval. Acceptance consumes the ordered positive N-CQ set
  projected by the requirement-owned standard, using Runner-provided ordinal/count/previous/next/
  final metadata and advancing only after a usable PASS. Any mutation uncertainty or failed
  readback stops new starts and preserves the scope for human handling.
