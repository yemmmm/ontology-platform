# Bounded preparation variant of R4.0-009; not a runtime authorization.
# Keep the full-scenario task and its historical CQ denominator unchanged.
schema_version: 2
task_id: r4-0-009-asset-fault-workorder
objective: >-
  Model one bounded industrial-service business chain: asset, fault and work order,
  their source-confirmed meanings and relationships, and only the shared definitions
  required to express that chain. Business-owner confirmation establishes disputed
  relationship direction, cardinality, lifecycle and terminology; database structure
  and sample rows are mapping evidence, not business truth. Keep unconfirmed facts
  explicit. Do not preselect Ontology boundaries or copy source rows into RDF.
  Contract coverage, SLA clocks, cost/profit metrics, inventory, procurement, API/SQL
  mapping and whole-scenario completion are outside this task. A second chain requires
  an explicit scope extension; broad source documents do not expand this boundary.
  Reuse the existing scenario-map, candidate, approval and staged execution contracts.
  CQ drafts and public/hidden pools cover only this bounded chain and its necessary
  dependencies. Prefer a small pool (about four to six questions overall, including
  hidden coverage) that tests identity, relationships and explicit unknowns; counts
  are advisory and the approved pool controls acceptance. Freeze before semantic
  modeling. Never reuse the previous full-scenario pool as this task's denominator.
  Coordinator passes this exact task_id and current chain/dependencies to Protocol.
  Protocol creates the BuildSession before its checkpoint and lease, owns platform
  envelopes and receipts, and executes approved unchanged plans in dependency order.
  Trust bound successful apply/Attempt/version receipts under R4.3-015; do not replay
  historical writes or revalidate applied plans against later revisions. Pending
  writes retain current identity, approval, authorization and dry-run/apply checks.
  After first-chain application, publish materialization_progress, retain the freeze_id
  and a small approved public-question selection, and expose the handoff through
  Coordinator's existing artifacts/status. Delivery observes it and starts the existing
  public-feedback operation; Coordinator does not send TeamTransport messages to
  Delivery. Return only public feedback through the existing instruction path.
  Complete necessary governed business reads and the existing R4.0-024 association
  self-check before handoff. Preserve defects, unknowns and scope gaps. Final independent
  acceptance reads the actual authorized model, cannot repair production and cannot
  consume production context or reveal hidden questions. Public feedback and applied
  receipts do not establish final semantic PASS. Report results only for this chain.
