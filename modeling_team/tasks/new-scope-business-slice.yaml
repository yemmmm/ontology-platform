expected_terminal_evidence:
  - direct Modeling-to-Protocol semantic delivery and Protocol receipt or conflict feedback
  - immutable Modeling Batch dry_run and apply_atomic receipts
  - rejected Shape-negative dry_run receipt with unchanged workspace
  - completed or blocked result from every Agent
retain_nonempty: true
semantic_start_evidence:
