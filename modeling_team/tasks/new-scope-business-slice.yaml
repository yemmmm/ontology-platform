schema_version: 2
task_id: new-scope-business-slice
objective: >-
  Model the bounded published Dify Workflow-as-Tool C -> B -> A path from the frozen
  role-private business sources. Coordinator assigns work and asks one grounded plain
  business question at a time when a material fact is missing. Modeling owns ontology
  semantics and sends candidates directly to Protocol. Protocol alone translates the
  agreed candidate into immutable dry_run then apply_atomic Modeling Batches, performs
  the required generic reads, validation and reasoning, and returns mechanical receipts
  or semantic conflicts directly to the relevant Agent. Protocol must submit one separate
  invalid Shape instance as dry_run only and retain its rejected receipt without workspace
  movement. For a Tool identity with published/latest state but no deployment binding, Modeling
  must not infer a concrete version: first ask one grounded Tool-binding question and wait for
  an outer answer; otherwise retain explicit_unknown. Do not invent unavailable facts or infer
  tester-only acceptance answers. Before freezing a candidate, Modeling closes only visible-source
  and consumer-question material gaps one grounded question at a time, reassessing remaining gaps
  after every answer. For an eligible fresh-create incomplete, degraded, or truncated ontology-scoped
  generic query, Protocol MUST first collect the formal fallback proof and call the native verifier;
  it must not directly block. Generic-query or native-verifier complete=true is successful retrieval
  evidence. Only a native verifier tool/protocol error or incomplete result is a fail-closed
  retrieval-completeness conflict, and Modeling does not complete from that receipt.
