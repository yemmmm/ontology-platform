# R4.0-009 active task. Sources remain the existing experimental fixture;
# missing business facts require approved interviews. This file is not runtime
# authorization or a frozen CQ pool. The active run may include the explicitly
# authorized core and mapping scope; selecting this task does not authorize
# future R4.0-010/011 mapping work.
# R4.0-012 contracts are reused.  This task reuses the current multi-slice Runner,
# competency-question profile and role packages while selecting the contracts
# that no longer require source-tracing publication or lineage completion.
# Historical R3 tasks remain readable as archived run definitions; they are not
# selected by this active entry point.
schema_version: 2
task_id: r4-0-009-multiview-semantic-acceptance
objective: >-
  Model the currently authorized multi-view industrial service scenario from
  the approved sources and approved interview answers, covering the core
  objects, classifications, Actions, calls, flows, rules and business
  responsibilities together with any explicitly authorized mapping scope in
  the active run. Reuse shared business identity across those views. Missing
  behavior contracts, scripts, role policies, shared-change facts and mapping
  meaning require business-owner confirmation; neither schema columns nor
  examples or tester-only expectations establish those facts. Retain mapping
  work that is unavailable, unapproved or unverified as an explicit gap.
  Selecting this task or mounting the R4.0-010/011 contracts does not grant
  authorization for future mapping work, external database/API access or
  acceptance beyond the active run's approved scope.
  CQ review and hidden-pool freezing precede formal semantic modeling; use only
  the approved public projection. Independent acceptance consumes modeled
  semantic resources, not production context, and does not repair this run.  Use the mounted r4-0-007 scenario-map contract for interleaved
  viewpoints, stable shared definitions, maintenance ownership, explicit
  unknowns/conflicts and scoped reference reviews before shared changes.
  Preserve source fidelity, explicit unknowns, competency-question
  coverage, generic semantic scope, deterministic dry-run/apply/readback,
  authorization and independent acceptance.  Modeling candidates contain
  semantic meaning, shared slice scope and unknowns only; Protocol owns Batch
  envelopes, platform IDs, write receipts and read handles.  The active flow
  does not create, attach or complete source-tracing records and does not use
  their absence as a semantic failure.  Relational source rows remain in the
  source database and are not copied into RDF individuals.
  Before whole-run terminal and production handoff, perform the mounted R4.0-024
  production association self-check over the actual authorized model. Coordinator
  organizes it, Protocol reads and supplies mechanical association candidates,
  and Modeling judges business meaning and revises confirmed defects. Complete
  required repair/readback/rechecks while all production roles remain active.
  Retain partial coverage, explicit unknowns and unresolved defects; this check
  is not independent acceptance or a new irreversible platform gate.
