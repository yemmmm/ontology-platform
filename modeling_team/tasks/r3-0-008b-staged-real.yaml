# R3.0-008B v3.0 real staged modeling decisions task (frozen configuration
# asset; see design §9 ruling 2).
#
# GATE (double): this task MUST NOT be started before (a) the R3.0-009
# mechanical increment that fills the stage 3 minimal slot contract is
# complete, and (b) the user-authorized R3.0-006 modeling start for the real
# v3.0 run is granted. Starting it consumes a real modeling start and requires
# the attempt budget granted with that authorization. Segment 1 delivery must
# not start it on its own.
#
# role_sources carries two disjoint classes:
# - business inputs: exactly the 4 allowed_files of
#   docs/evaluation-scenarios/industrial-service-v3/modeling-input/input-manifest.json
#   (scenario-brief.md, business-terms.md, schema.sql, sample-data.sql).
# - platform/protocol reference contracts under modeling_team/references/
#   (staged to /agent/home/sources/modeling_team/references/, matching the
#   R3.0-002 real-task staging precedent). These are platform contracts, not
#   business inputs and not tester-only truth.
#
# protocol_tools deliberately OMITS submit_modeling_batch: every Modeling
# Batch submission in this task goes through the Runner-private
# protocol_staged_submit_modeling_batch capability only.
schema_version: 2
task_id: r3-0-008b-staged-real
objective: >-
  Model the complete industrial after-service v3 scenario through the staged
  seven-gate order: scenario understanding, logical slicing, the platform
  neutral base-graph minimal slot (deferred_contract R3.0-009), the R3.0-002
  topology decision, base business semantics modeling with value analysis
  recorded as analyzed_not_materialized conclusions, database mapping and
  value semantics materialization through the staged submission capability,
  and the joint acceptance checklist. Modeling reads the four mounted input
  files, registers every controlled-value candidate as an analysis conclusion
  in analyzed status under
  value-semantics/conclusions/analysis-conclusions.json with evidence refs,
  proposed level, blocking unknowns, and an immutable archived revision chain,
  and never self-confirms a value from database samples. Coordinator approves
  conclusion transitions only after business confirmation, records the
  approvals artifact and the materialization unlock (mapping sources and
  confirmed codes, or the explicit skip reason), and maintains the joint
  acceptance checklist with the seven fixed items. Protocol alone submits
  Modeling Batches exclusively through the
  protocol_staged_submit_modeling_batch capability with verbatim envelopes,
  value traces naming the confirmed conclusions, and L3 nodes only for
  confirmed L3 conclusions, maintains the materialization ledger against
  authoritative receipts, and never bypasses the capability with a direct
  platform write. All staged artifacts follow the mounted
  modeling_team/references/r3-0-008b-staged-decisions-contract.json. Keep
  business rows in PostgreSQL: never create RDF individuals for source rows;
  treat schema names and samples as mapping evidence, not business truth.
role_sources:
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/scenario-brief.md
    classification: business-source
    roles: [coordinator, modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/business-terms.md
    classification: business-source
    roles: [coordinator, modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/schema.sql
    classification: business-source
    roles: [modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/sample-data.sql
    classification: business-source
    roles: [modeling]
  - path: modeling_team/references/r3-0-002-scenario-map-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/r3-0-008b-staged-decisions-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/platform-neutral-candidate-authoring.json
    classification: protocol
    roles: [modeling, protocol]
  - path: modeling_team/references/modeling-batch-item-contract.json
    classification: protocol
    roles: [protocol]
protocol_tools:
  - check_platform_health
  - get_project_build_context
  - get_ontology_workspace_context
  - create_build_session
  - get_build_session
  - save_build_checkpoint
  - complete_build_session
  - cancel_build_session
  - acquire_ontology_lease
  - renew_ontology_lease
  - release_ontology_lease
  - get_modeling_batch
  - list_session_modeling_batches
  - list_ontology_modeling_batches
  - get_modeling_context
  - get_ontology_read_model
  - query_semantic_context
  - run_semantic_validation
  - run_semantic_reasoning
  - get_ontology_lineage
  - inspect_semantic_statement_provenance
  - list_semantic_protection_sets
  - create_semantic_protection_set
  - update_semantic_protection_set
  - delete_semantic_protection_set
  - add_semantic_protection_set_members
  - remove_semantic_protection_set_members
expected_terminal_evidence:
  - scenario-map-six-sections-maintained
  - topology-decision-three-options-six-dimensions
  - stage3-minimal-slot-with-approval
  - conclusions-analyzed-not-materialized-chain
  - materialization-unlock-and-approvals-recorded
  - staged-submission-receipts-and-ledger-closed
  - joint-acceptance-checklist-seven-items
  - explicit-unknowns-resolved-or-retained
retain_nonempty: true
semantic_start_evidence:
  - clean-checkout-and-empty-status
  - canonical-mode-http-200-rdf-primary
  - role-visible-source-manifest
  - frozen-runtime-baseline
parameters:
  multi_slice_workflow: true
  staged_modeling_decisions: true
