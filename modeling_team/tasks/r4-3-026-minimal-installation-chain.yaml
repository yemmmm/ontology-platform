# Material/Task delivery only; a real run needs separate current authorization.
schema_version: 2
task_id: r4-3-026-minimal-installation-chain
objective: >-
  Model the complete artificial installation-location chain in
  minimal-installation-chain-source-v1: two distinct concepts and one directed relationship,
  with only the supplied meanings and explicit unknowns. This is a new independent Task,
  not the checkpoint-recovery experiment or the industrial-service scenario. Do not infer
  cardinality, named instances, ownership, customers, models, faults, work orders, lifecycle,
  metrics or SQL/API mappings. Agent-chosen technical representation and Ontology topology
  do not add business concepts. Use the paired minimal-installation-chain Profile and its
  compact contracts. CQ uses its private task-specific question seeds, adapts them to actual
  approved slices and submits them for normal review and a fresh public/hidden freeze;
  counts are advisory. Do not import any historical pool or answer. After Host confirms the
  freeze, Coordinator dispatches this Task identity and confirmed topology to Modeling.
  Retain actual approved slice IDs verbatim across dispatch, modeling and CQ; do not normalize
  their spelling. Modeling publishes a complete immutable semantic delivery using registered
  unified candidate kinds or supported fields-only concept/relationship definitions, and submits explicit changes
  through R4.3-024/025. The program owns execution fields and atomic application; no
  Protocol translation approval or model dry-run prerequisite. Trust bound successful
  receipts; reconcile uncertain writes before retry. Perform actual governed business reads
  on the current revision, association self-check and resource closure before handoff.
  Final Consumer/Judge acceptance is independent and read-only. Report only this bounded
  scope, exact evidence, unknowns and the first blocker. Host records elapsed time to apply,
  first effective answer and independent acceptance, semantic/technical/wait time and
  R4.3-019 usage coverage; missing values remain unknown. No fixed performance or token
  budget is supplied. Do not checkpoint-stop/resume as an experiment, start another task,
  change an old verdict or consume a modeling round without user authorization.
