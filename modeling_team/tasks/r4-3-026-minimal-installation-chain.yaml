# Material/Task delivery only; a real run needs separate current authorization.
schema_version: 2
task_id: r4-3-026-minimal-installation-chain
objective: >-
  Model the complete bounded business scope in the mounted approved business sources.
  Preserve supplied meanings, semantic level, relationship direction and explicit unknowns;
  do not invent facts or expand the authorized scope. Use the selected general role packages,
  Skills and shared representation/execution contracts. CQ may use its role-private question
  seeds as proposed coverage, never as business truth or a preapproved answer pool. Review
  and freeze the current complete public/hidden pool before formal semantic modeling.
  Independent Consumer/Judge acceptance covers only the approved business scope. Report
  actual evidence, remaining gaps, first blocker, elapsed time and usage through the existing
  workflow; this Task grants no new modeling round or checkpoint experiment.
