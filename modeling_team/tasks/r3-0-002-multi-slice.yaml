# R3.0-002 v3.0 real multi-slice task configuration (frozen configuration
# asset; see design §9 ruling 2).
#
# GATE: this task MUST NOT be started before the R3.0-006 user authorization
# for the real v3.0 modeling run. Starting it consumes a real modeling start
# and requires the attempt budget granted with that authorization.
#
# role_sources carries two disjoint classes:
# - business inputs: exactly the 4 allowed_files of
#   docs/evaluation-scenarios/industrial-service-v3/modeling-input/input-manifest.json
#   (scenario-brief.md, business-terms.md, schema.sql, sample-data.sql).
#   input-manifest.json itself and every tester-only reference document stay
#   unmounted; the Agent namespace never includes the parent directory.
# - platform/protocol reference contracts under modeling_team/references/
#   (R3.0-006 start2 narrow repair; the frozen agent-package instructions
#   mandate reading them from /agent/home/sources/modeling_team/references/,
#   matching the R2.3-005 formal-task staging precedent). These are platform
#   contracts, not business inputs and not tester-only truth.
schema_version: 2
task_id: r3-0-002-multi-slice
objective: >-
  Model the complete industrial after-service v3 scenario as multiple bounded
  logical slices under one project-level scenario map, then apply the approved
  topology in dependency order. Coordinator reads the mounted scenario brief
  and business terms, maintains the six-section scenario map (slices, shared
  term registry with exactly one owner slice per term, cross-slice
  dependencies, per-slice ownership, cross-slice competency questions,
  explicit unknowns, adjustments) under scenario-map/ in the run workspace per
  modeling_team/references/r3-0-002-scenario-map-contract.json, approves every
  slice-set adjustment, and summarizes the protection IRI suggestion handover
  (absolute IRIs with reasons, proposing slice, existing:<id> or new:<name>
  target). Modeling reads all four mounted input files, produces one complete
  semantic candidate per slice, declares shared terms and explicit unknowns,
  and never assembles platform protocol parameters. Before the first real
  apply, Coordinator records a topology decision comparing at least
  single_ontology, domain_ontology_split, and shared_core_plus_domain across
  all six fixed dimensions: concept cohesion, relation density, reuse,
  permission boundary, change cadence, and cross-domain query — never table
  count or team count; until that record is structurally complete, every
  platform MCP call stays rejected by the independent topology gate, which is
  expected behavior, and Coordinator repairs the artifact from the typed gate
  reason codes instead of retrying platform calls. Protocol alone translates
  approved candidates: when the topology selects multiple Ontologies, submit
  at least one Modeling Batch per Ontology in scenario-map dependency order
  (each batch bound to exactly one ontology, dry_run then apply_atomic per
  batch, no cross-batch atomicity); the frozen scope JSON names only the
  first Ontology, and the full planned list is delivered by the gate-open
  runner notice and held authoritatively by get_project_build_context, so
  treat that build-context listing as the ontology set of record. Protocol
  executes protection-set changes through
  the six semantic protection set tools as independent operations that never
  share a Modeling Batch with ontology publication; protecting target IRIs
  before creating the resources is the recommended order, not a platform
  constraint. Keep business rows in PostgreSQL: never create RDF individuals
  for source rows; treat schema names and samples as mapping evidence, not
  business truth, and confirm lifecycle, metric, causality, and protected
  audiences through the user interview before asserting them as semantics.
role_sources:
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/scenario-brief.md
    classification: business-source
    roles: [coordinator, modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/business-terms.md
    classification: business-source
    roles: [coordinator, modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/schema.sql
    classification: business-source
    roles: [modeling]
  - path: docs/evaluation-scenarios/industrial-service-v3/modeling-input/sample-data.sql
    classification: business-source
    roles: [modeling]
  - path: modeling_team/references/r3-0-002-scenario-map-contract.json
    classification: coordination
    roles: [coordinator, modeling, protocol]
  - path: modeling_team/references/platform-neutral-candidate-authoring.json
    classification: protocol
    roles: [modeling, protocol]
  - path: modeling_team/references/modeling-batch-item-contract.json
    classification: protocol
    roles: [protocol]
  - path: modeling_team/references/acceptance-stage-handoff-contract.json
    classification: protocol
    roles: [protocol]
protocol_tools:
  - check_platform_health
  - get_project_build_context
  - get_ontology_workspace_context
  - create_build_session
  - get_build_session
  - save_build_checkpoint
  - complete_build_session
  - cancel_build_session
  - acquire_ontology_lease
  - renew_ontology_lease
  - release_ontology_lease
  - submit_modeling_batch
  - get_modeling_batch
  - list_session_modeling_batches
  - list_ontology_modeling_batches
  - get_modeling_context
  - get_ontology_read_model
  - query_semantic_context
  - run_semantic_validation
  - run_semantic_reasoning
  - get_ontology_lineage
  - inspect_semantic_statement_provenance
  - list_semantic_protection_sets
  - create_semantic_protection_set
  - update_semantic_protection_set
  - delete_semantic_protection_set
  - add_semantic_protection_set_members
  - remove_semantic_protection_set_members
expected_terminal_evidence:
  - scenario-map-six-sections-maintained
  - topology-decision-three-options-six-dimensions
  - per-slice-candidates-with-shared-terms
  - dependency-ordered-multi-batch-dry-run-apply-receipts
  - protection-iri-suggestions-executed-or-retained
  - explicit-unknowns-resolved-or-retained
retain_nonempty: true
semantic_start_evidence:
  - clean-checkout-and-empty-status
  - canonical-mode-http-200-rdf-primary
  - role-visible-source-manifest
  - frozen-runtime-baseline
parameters:
  multi_slice_workflow: true
