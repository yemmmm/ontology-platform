# R3.0-015 bounded real L0 checkpoint/recovery task; L1 quality remains unverified.
schema_version: 2
task_id: r3-0-015-real-checkpoint-l0
objective: Real bounded L0 check of R3.0-015 checkpoint publication and cross-process recovery. Use only
  one source-grounded logical slice of the industrial after-service input, prefer basic customer, installed-asset
  and equipment-model relationships where the approved source directly supports them. Mark lifecycle,
  metrics, values, access and other unresolved business semantics as unknown; do not infer rules from
  schema or samples. Produce the smallest honest published artifacts needed for scenario_mapped, cq_frozen,
  semantic_approved and one deterministic dry-run materialization_progress checkpoint; publish production_handoff
  only if the actual readiness contract is met. Coordinator should request checkpoint saves after the
  scenario decision and one approved candidate, and hand off the resulting IDs to the host. Do not expand
  to the complete 21-table scenario or seek an L1 model-quality verdict in this run. Keep the real source,
  CQ review, candidate approval, staged translation review, deterministic dry-run and application guards
  in force. If any stage cannot be completed honestly, save the last valid checkpoint, report the exact
  blocker and exit without fabricating completion. The Host owns checkpoint save/inspect through the outer
  FIFO; role workspaces do not mount checkpoint packages. Coordinator and Modeling report actual published
  artifact refs and request IDs to the Host, and must not infer a missing checkpoint from their role-local
  visibility. A resumed run uses its checkpoint role handoff to skip already confirmed interview/scenario
  decisions. CQ public review/freeze must precede final candidate business approval and any Modeling Batch
  submission; an unapproved draft remains pending. For each fresh standalone Team Transport delivery,
  omit reply_to_delivery_id entirely; never pass the literal string null. Set reply_to_delivery_id only
  to an actual active request delivery ID whose expects_reply flag is true. Modeling sends its complete
  candidate to Protocol as a new expects_reply=true request, and sends Coordinator only scoped status
  without raw source or hidden CQ text.
