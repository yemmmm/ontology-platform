# Team Model Profile for the 2026-09-14 auth-r3-0-014 batch (R3.0-014 first
# real run): identical roster and route to ``glm-high``/``glm-max`` -- the
# r3-0-011-competency-question Profile roster (coordinator, modeling, protocol,
# competency-question) plus the Platform Examiner production side
# (``platform-examiner``) and the Judge (package ID ``acceptance``) -- but every
# role binds the ``glm-direct`` route to the exact model ``glm-5.3`` at ``low``
# reasoning effort, per the user's explicit authorization ("模型选用glm-5.3 low").
# Paired with ``glm-max``/``glm-high`` this isolates the low end of the effort
# axis on the same model and route for the comparison matrix.
#
# The profile ID drops the model's version suffix because ``SAFE_ID`` allows
# only ``[a-z0-9-]``; the precise model string lives in every ``model:``
# binding.  ``glm-direct`` is the Zhipu direct Responses route: the role
# reaches it through the Host-owned loopback session, so no role ever holds
# the GLM API key.  The upstream endpoint accepts ``low`` verbatim (verified
# 2026-09-13 with a one-shot probe: effort=low completed with
# reasoning_tokens=0), so no effort folding applies.  No OpenAI route is
# declared, so no role can silently ride the Codex built-in ChatGPT
# subscription.  validate, baseline, and run must select this profile
# explicitly via ``--model-profile glm-low``.
schema_version: 1
model_profile_id: glm-low
roles:
  coordinator:
    model_provider: glm-direct
    model: glm-5.3
    model_reasoning_effort: low
  modeling:
    model_provider: glm-direct
    model: glm-5.3
    model_reasoning_effort: low
  protocol:
    model_provider: glm-direct
    model: glm-5.3
    model_reasoning_effort: low
  competency-question:
    model_provider: glm-direct
    model: glm-5.3
    model_reasoning_effort: low
  platform-examiner:
    model_provider: glm-direct
    model: glm-5.3
    model_reasoning_effort: low
  acceptance:
    model_provider: glm-direct
    model: glm-5.3
    model_reasoning_effort: low
