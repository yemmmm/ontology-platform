[project]
name = "llm-access-lab"
version = "0.1.0"
description = "A small runnable modeling fixture for model access and request quotas"
requires-python = ">=3.11"
dependencies = ["fastapi==0.137.1", "uvicorn==0.49.0"]

[project.optional-dependencies]
test = ["pytest==9.1.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
