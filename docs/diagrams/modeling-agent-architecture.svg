  <rect class="node" x="1280" y="185" width="235" height="72" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="label" x="1397" y="213"><tspan x="1397">FastAPI</tspan><tspan class="small" x="1397" dy="22">UI / HTTP adapters</tspan></text>
  <rect class="node" x="970" y="300" width="270" height="76" rx="12" fill="#f5f5f5" stroke="#6c8ebf"/><text class="label" x="1105" y="328"><tspan x="1105">BuildSessionService</tspan><tspan class="small" x="1105" dy="22">Context · Session · Checkpoint · Lease</tspan></text>
  <rect class="node" x="1260" y="300" width="270" height="76" rx="12" fill="#f5f5f5" stroke="#6c8ebf"/><text class="label" x="1395" y="328"><tspan x="1395">ModelingWorkflowService</tspan><tspan class="small" x="1395" dy="22">Artifact versions · Events · export</tspan></text>
  <rect class="node" x="970" y="410" width="270" height="100" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="label" x="1105" y="438"><tspan x="1105">ModelingBatchService</tspan><tspan class="small" x="1105" dy="21">compile · dry-run · Findings · idempotency</tspan><tspan class="small" x="1105" dy="20">Lease/version guard · fence · recovery</tspan></text>
  <rect class="node" x="1260" y="410" width="270" height="100" rx="12" fill="#d5e8d4" stroke="#82b366"/><text class="label" x="1395" y="438"><tspan x="1395">语义读与验收服务</tspan><tspan class="small" x="1395" dy="21">Context Query · scoped SPARQL</tspan><tspan class="small" x="1395" dy="20">SHACL · lineage / Evidence</tspan></text>
