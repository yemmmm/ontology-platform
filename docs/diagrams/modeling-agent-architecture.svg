  <path class="node" d="M1260 580Q1260 560 1395 560Q1530 560 1530 580V680Q1530 700 1395 700Q1260 700 1260 680Z" fill="#f8cecc" stroke="#b85450"/>
  <ellipse cx="1395" cy="580" rx="135" ry="20" fill="#fbe4e3" stroke="#b85450" stroke-width="2"/>
  <text class="label" x="1395" y="613"><tspan x="1395">RDF Dataset / Oxigraph</tspan><tspan class="small" x="1395" dy="21">权威本体结构与实例事实</tspan><tspan class="small" x="1395" dy="19">asserted ontology/data · shapes · policy</tspan><tspan class="small" x="1395" dy="19">Operation · statements</tspan></text>
  <rect class="node" x="970" y="745" width="560" height="65" rx="12" fill="#fff2cc" stroke="#d6b656"/>
