<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9673a6"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#82b366"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6c8ebf"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b85450"/></marker>
    <style>
      text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700;text-anchor:middle}.subtitle{font-size:16px;fill:#475569;text-anchor:middle}
      .laneTitle{font-size:19px;font-weight:700}.node{stroke-width:2}.label{font-size:15px;font-weight:600;text-anchor:middle}.small{font-size:13px;font-weight:500;text-anchor:middle}.tiny{font-size:12px;font-weight:500;text-anchor:middle}
      .edge{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}.purple{stroke:#9673a6;marker-end:url(#arrowPurple)}.green{stroke:#82b366;marker-end:url(#arrowGreen)}.blue{stroke:#6c8ebf;marker-end:url(#arrowBlue)}.red{stroke:#b85450;marker-end:url(#arrowRed)}
