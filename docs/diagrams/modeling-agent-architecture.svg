  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="title" x="800" y="46">建模 Agent 当前架构（代码与文档基线：2026-07-22）</text>
  <text class="subtitle" x="800" y="78">智能建模在平台外部；平台负责确定性验证、治理、存储、证据、lineage 与查询</text>

  <rect x="40" y="120" width="410" height="750" rx="14" fill="#faf5ff" stroke="#9673a6" stroke-width="2"/>
  <rect x="40" y="120" width="410" height="42" rx="14" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text class="laneTitle" x="60" y="148">外部智能建模层</text>

  <rect class="node" x="80" y="190" width="330" height="72" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="label" x="245" y="219"><tspan x="245">用户</tspan><tspan class="small" x="245" dy="23">业务目标 · 范围 · 澄清 · 价值判断</tspan></text>
  <path class="node" d="M80 295H410V365Q390 352 370 365Q350 378 330 365Q310 352 290 365Q270 378 250 365Q230 352 210 365Q190 378 170 365Q150 352 130 365Q105 378 80 365Z" fill="#fff2cc" stroke="#d6b656"/>
