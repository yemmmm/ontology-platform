  <rect class="node" x="80" y="425" width="330" height="105" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="label" x="245" y="457"><tspan x="245">主建模 Agent + ontology-builder Skill</tspan><tspan class="small" x="245" dy="23">用户交流 · 阶段协调 · 质量判断</tspan><tspan class="small" x="245" dy="21">唯一获取 Lease / 正式 apply 的角色</tspan></text>
  <rect class="node" x="65" y="585" width="112" height="76" rx="10" fill="#f5f5f5" stroke="#666"/><text class="small" x="121" y="615"><tspan x="121">业务整理</tspan><tspan x="121" dy="21">Pack / Coverage</tspan></text>
  <rect class="node" x="189" y="585" width="112" height="76" rx="10" fill="#f5f5f5" stroke="#666"/><text class="small" x="245" y="608"><tspan x="245">建模子 Agent</tspan><tspan x="245" dy="20">候选模型</tspan><tspan x="245" dy="19">Batch 草案</tspan></text>
  <rect class="node" x="313" y="585" width="112" height="76" rx="10" fill="#f5f5f5" stroke="#666"/><text class="small" x="369" y="608"><tspan x="369">独立评审</tspan><tspan x="369" dy="20">PASS / REVISE</tspan><tspan x="369" dy="19">/ BLOCKED</tspan></text>
  <text class="small" x="245" y="735" fill="#6b21a8"><tspan x="245">角色使用独立上下文；子 Agent 不持有平台凭证、</tspan><tspan x="245" dy="21">Lease token 或写权限</tspan></text>

  <rect x="480" y="120" width="430" height="750" rx="14" fill="#f0fdf4" stroke="#82b366" stroke-width="2"/>
  <rect x="480" y="120" width="430" height="42" rx="14" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text class="laneTitle" x="500" y="148">Repo-local 协作与交接层（已实现）</text>
  <rect class="node" x="515" y="185" width="360" height="145" rx="12" fill="#d5e8d4" stroke="#82b366"/>
  <text class="label" x="695" y="216"><tspan x="695">Shared Modeling Directory（R1.1-006）</tspan><tspan class="small" x="695" dy="23">run / brief / source-index / coverage</tspan><tspan class="small" x="695" dy="21">Work Unit task · result · status</tspan><tspan class="small" x="695" dy="21">candidate · review · batch-plan · verification</tspan></text>
  <rect class="node" x="515" y="355" width="360" height="94" rx="12" fill="#f5f5f5" stroke="#82b366"/>
  <text class="label" x="695" y="382"><tspan x="695">shared_modeling_directory.py</tspan><tspan class="small" x="695" dy="22">原子写入 · 引用校验 · 合并 · 确定性分批</tspan><tspan class="small" x="695" dy="20">materialize / bind response / verification gate</tspan></text>
  <rect class="node" x="515" y="480" width="360" height="105" rx="12" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="label" x="695" y="510"><tspan x="695">Reliable Modeler Handoff（R1.1-003）</tspan><tspan class="small" x="695" dy="23">受控 spool · 原子发布 · Manifest / SHA-256</tspan><tspan class="small" x="695" dy="21">完整七字段 JSON 不经 PTY / chat 传输</tspan></text>
  <rect class="node" x="515" y="620" width="360" height="96" rx="12" fill="#f5f5f5" stroke="#666" stroke-dasharray="7 5"/>
  <text class="label" x="695" y="649"><tspan x="695">Repo-local Harness（可选 / 评测用途）</tspan><tspan class="small" x="695" dy="22">Hook 事件、阶段、有限摘要、脱敏 retrospective</tspan><tspan class="small" x="695" dy="20">不替代平台事实，不作为建模恢复输入</tspan></text>
  <rect class="node" x="515" y="750" width="360" height="75" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="8 5"/>
  <text class="small" x="695" y="779"><tspan x="695">R1.1-007：Local / Formal 统一 Profile 与薄 Adapter</tspan><tspan x="695" dy="21">当前状态：已细化，待实现（虚线表示非现状）</tspan></text>

