[project]
name = "ontology-platform-backend"
version = "0.1.0"
description = "FastAPI backend and MCP server for Ontology Platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.0",

  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pyshacl>=0.28",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
